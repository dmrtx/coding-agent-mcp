# coding-agent-mcp example configuration

server:
  # Base directory for task databases, logs, and Git worktrees
  data_dir: ~/.coding-agent-mcp
  # Maximum concurrent agent tasks running simultaneously
  max_concurrent_tasks: 2
  # Default timeout in seconds for agent tasks
  default_task_timeout_seconds: 1800
  # Maximum bytes retained in memory/truncated per stream
  output_limit_bytes: 5000000
  # Grace period in milliseconds between SIGTERM and SIGKILL
  workspace_grace_period_ms: 3000

agents:
  muse:
    enabled: true
    executable: muse
    sandbox: true
    default_timeout_seconds: 1800
    env_allowlist:
      - HOME
      - PATH
      - TMPDIR
      - USER
      - SHELL
      - LANG
      - LC_ALL
      - TERM

  agy:
    enabled: true
    executable: agy
    sandbox: true
    # Opt in only when account OAuth must use the macOS login Keychain.
    # Code changes remain isolated in worktrees, but AGY can access your HOME.
    use_host_home: false
    default_timeout_seconds: 1800
    env_allowlist:
      - HOME
      - PATH
      - TMPDIR
      - USER
      - SHELL
      - LANG
      - LC_ALL
      - TERM

  # Direct Gemini API mode through the installed AGY CLI and agy-gyro retry
  # proxy. This route does not use account OAuth or macOS Keychain.
  agy-gemini:
    enabled: false
    executable: /path/to/agy-gyro
    agy_executable: /path/to/agy
    gyro_args: [] # e.g. ["--max-retries", "15"]
    sandbox: true
    default_timeout_seconds: 1800
    env_allowlist:
      - PATH
      - TMPDIR
      - USER
      - SHELL
      - LANG
      - LC_ALL
      - TERM
      - GEMINI_API_KEY

  # Experimental additive Antigravity ACP adapter.
  # Disabled by default. Requires the operator to install/provide the official
  # `agy_acp_server` binary; there is no downloader. Legacy `agy` above
  # remains available independently.
  # See docs/agy-acp.md.
  agy-acp:
    enabled: false
    acp_executable: agy_acp_server
    # Optional wrapper arguments, for example when launching through agy-gyro:
    # acp_executable: /path/to/agy-gyro
    # acp_args: ["--agy-path", "/path/to/agy_acp_server.par", "--"]
    acp_args: []
    auth_method: oauth-personal # oauth-personal|oauth-business|gemini-api-key|agent-platform
    # model: <model-id-from-session-config-options> # optional model override (illustrative placeholder)
    mode: default # default|auto_edit|yolo (yolo requires allow_write_worktree: true)
    allow_write_worktree: false
    state_dir: ~/.coding-agent-mcp/agy-acp
    default_timeout_seconds: 1800
    env_allowlist:
      - HOME
      - PATH
      - TMPDIR
      - USER
      - SHELL
      - LANG
      - LC_ALL
      - TERM

repositories:
  my-project:
    root: /path/to/my-project
    writable: true
    allow_in_place: false # in_place strategy is disabled by default for safety
    default_workspace_strategy: worktree
    verification_profiles:
      test:
        command: ["npm", "test"]
        timeout_seconds: 900
      lint:
        command: ["npm", "run", "lint"]
        timeout_seconds: 300
